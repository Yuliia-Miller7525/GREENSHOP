<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REGISTER GREENSHOP</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="register-body">
    <header class="register-header">
      <div class="close-button">
        <a class="home-link" href="index.html">
          <span class="close">&times</span>
        </a>
      </div>
      <div class="login-register-links">
        <p>
          <a class="login-link" href="login.html">Login</a> |
          <span>Register</span>
        </p>
      </div>
    </header>
    <main class="register-main">
      <p class="register-main-p">Enter your email and password to register.</p>
      <form class="form">
        <input class="form-input" type="text" placeholder="Username" />
        <input
          class="form-input enter-email"
          type="email"
          placeholder="Enter your email address"
        />
        <div class="password">
          <input class="form-input" type="password" placeholder="Password" />
          <img src="./images/Hide.svg" />
        </div>
        <div class="password">
          <input
            class="form-input"
            type="password"
            placeholder="Confirm password"
          />
          <img src="./images/Hide.svg" />
        </div>
        <button class="primary-btn btn-color" type="submit">Register</button>
      </form>
      <p class="register-p">Or register with</p>
      <button class="login-btn-google">
        <img src="./images/google1.svg" width="20px" height="20px" />
        Continue with Google
      </button>
      <button class="login-btn-facebook">
        <img src="./images/Vector.svg" width="20px" height="20px" />
        Continue with Facebook
      </button>
    </main>
    <footer class="register-footer"></footer>
  </body>
</html>
