<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN GREENSHOP</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="login-body">
    <header class="login-header">
      <div class="close-button">
        <a class="home-link" href="index.html">
          <span class="close">&times</span>
        </a>
      </div>
      <div class="login-register-links">
        <p>
          <span>Login</span> |
          <a class="register-link" href="register.html">Register</a>
        </p>
      </div>
    </header>
    <main class="login-main">
      <p class="login-main-p">Enter your email and password to login.</p>
      <form class="form">
        <input
          class="form-input"
          type="email"
          placeholder="Enter your email address"
        />
        <div class="password">
          <input class="form-input" type="password" placeholder="Password" />
          <img src="./images/Hide.svg" />
        </div>
        <button class="primary-btn btn-color" type="submit">Login</button>
      </form>
      <p class="login-p">Or login with</p>
      <button class="login-btn-google">
        <img src="./images/google1.svg" width="20px" height="20px" />
        Continue with Google
      </button>
      <button class="login-btn-facebook">
        <img src="./images/Vector.svg" width="20px" height="20px" />
        Continue with Facebook
      </button>
    </main>
    <footer class="login-footer"></footer>
  </body>
</html>
